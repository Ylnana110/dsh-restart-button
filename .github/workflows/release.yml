name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack the bundle
        run: pnpm pack
      - name: Attach the tarball to the release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
